services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicoredb
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # 워커 PC들이 pgvector에 접속해야 하므로 외부 노출
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicore -d medicoredb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend-main
      dockerfile: Dockerfile
    container_name: medicore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/medicoredb
      DB_USERNAME: medicore
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # AI 요청은 같은 Docker 네트워크의 ai-router로
      AI_SERVER_URL: http://ai-router:80
      # 브라우저 접속 주소 (ai-router가 3000 포트로 서비스)
      CORS_ALLOWED_ORIGINS: http://192.168.0.20:3000
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medicore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 256m

  # 진입점: 브라우저 접속 + 각 워커 PC AI 서버로 경로별 라우팅
  ai-router:
    image: nginx:alpine
    container_name: medicore-ai-router
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./nginx/ai-router.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: medicore-network
