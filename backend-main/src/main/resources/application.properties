spring.application.name=backend-main
server.port=8080

# --- 공통 설정 (프로필별 오버라이드 가능) ---
logging.level.org.springframework.security=WARN

# AI 서버 주소 (프로필별로 달라짐)
ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# CORS (프로필별로 달라짐)
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JPA 공통
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:medicore-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
