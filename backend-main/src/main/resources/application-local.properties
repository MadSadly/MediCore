# =====================================================================
# LOCAL 프로필 - 로컬 개발 환경 (Docker Compose로 DB/Redis만 띄우고
#                Spring Boot는 IDE에서 직접 실행할 때 사용)
# 실행법: ./gradlew bootRun --args='--spring.profiles.active=local'
# =====================================================================

# PostgreSQL (Docker Compose로 띄운 postgres 컨테이너)
spring.datasource.url=jdbc:postgresql://localhost:5432/medicoredb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=medicore
spring.datasource.password=medicore_local_pw

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway (DB 마이그레이션 활성화)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# AI 서버 (FastAPI)
ai.server.url=http://localhost:8000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
