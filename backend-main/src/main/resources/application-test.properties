# =====================================================================
# TEST 프로필 - CI/CD 및 단위 테스트 환경
# GitHub Actions에서 외부 DB 없이 빠르게 빌드/테스트하기 위해 H2 사용
# =====================================================================

# H2 인메모리 DB (외부 의존성 없이 CI에서 바로 실행)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway 비활성화 (H2는 PostgreSQL SQL 방언 완전 호환 안됨)
spring.flyway.enabled=false

# Redis 비활성화 (CI 환경에서 Redis 컨테이너 불필요)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# AI 서버 (테스트에서는 Mock 처리)
ai.server.url=http://localhost:8000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
