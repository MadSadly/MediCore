# =====================================================================
# TEST 프로필 - CI/CD 단위 테스트 (H2 인메모리, 외부 의존성 없음)
# 전체 Spring 컨텍스트 테스트는 integration job (SPRING_PROFILES_ACTIVE=local) 에서 수행
# =====================================================================

# H2 인메모리 DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway 비활성화
spring.flyway.enabled=false

# Spring Batch 자동 실행 비활성화
spring.batch.job.enabled=false

# AutoConfiguration 제거 (한 줄 작성으로 공백 포함 방지)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# AI 서버
ai.server.url=http://localhost:8000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173