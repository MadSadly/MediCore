# =====================================================================
# PROD 프로필 - 운영 환경 (CloudType 또는 WSL2+Docker)
# 모든 민감값은 환경변수로 주입 (.env 또는 CloudType Secret 사용)
# 실행법: SPRING_PROFILES_ACTIVE=prod (Docker CMD 또는 CloudType 설정)
# =====================================================================

# PostgreSQL - 환경변수 필수
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# prod에서는 절대 create/create-drop 사용 금지 - Flyway가 관리
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis - 환경변수 필수
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# AI 서버 - Docker Compose 네트워크에서는 서비스명으로 접근
ai.server.url=${AI_SERVER_URL:http://ai-server:8000}

# CORS - 실제 도메인으로 변경
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-domain.com}

# 운영 로그 레벨
logging.level.root=WARN
logging.level.com.example=INFO
