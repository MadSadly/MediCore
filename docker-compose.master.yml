# ================================================================
# MEDI-Zero Master PC docker-compose
# 실행: docker compose -f docker-compose.master.yml up -d
#
# [IP 구성 예시 - 팀 환경에 맞게 수정]
# Master : 192.168.0.100  (이 파일 실행)
# Worker1: 192.168.0.101  (피부)
# Worker2: 192.168.0.102  (뇌종양)
# Worker3: 192.168.0.103  (안과)
# Worker4: 192.168.0.104  (척추)
# Worker5: 192.168.0.105  (신장)
# Worker6: 192.168.0.106  (대장암)
# ================================================================

services:

  # ── PostgreSQL 16 + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medizero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medizerodb
      POSTGRES_USER: medizero
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medizero -d medizerodb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g   # Master 16GB 중 1GB 할당

  # ── PostgreSQL 자동 백업 (SPOF 대비) ─────────────────────────
  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: medizero-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: medizerodb
      POSTGRES_USER: medizero
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"          # 매일 자동 백업
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medizero-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Spring Boot Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend-main
      dockerfile: Dockerfile
    container_name: medizero-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/medizerodb
      DB_USERNAME: medizero
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # 워커 PC IP 목록 (헬스 스케줄러가 참조)
      WORKER_SKIN_URL: http://${WORKER1_IP:-192.168.0.101}:8000
      WORKER_BRAIN_URL: http://${WORKER2_IP:-192.168.0.102}:8000
      WORKER_EYES_URL: http://${WORKER3_IP:-192.168.0.103}:8000
      WORKER_SPINE_URL: http://${WORKER4_IP:-192.168.0.104}:8000
      WORKER_KIDNEY_URL: http://${WORKER5_IP:-192.168.0.105}:8000
      WORKER_COLON_URL: http://${WORKER6_IP:-192.168.0.106}:8000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  # ── React Frontend (Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medizero-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: medizero-master-network
