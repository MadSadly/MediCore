<svg width="660" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 z" fill="#95A5A6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="660" height="600" fill="#F8F9FA" rx="12"/>

  <!-- Title -->
  <text x="330" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50">Git 작업 흐름 (매일 반복)</text>

  <!-- ── STEP 1 ── y=55, h=65 -->
  <rect x="60" y="55" width="540" height="65" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="55" width="100" height="65" rx="10" fill="#2980B9"/>
  <rect x="130" y="55" width="30" height="65" fill="#2980B9"/>
  <text x="110" y="93" text-anchor="middle" font-size="24" font-weight="bold" fill="white">①</text>
  <rect x="170" y="63" width="56" height="20" rx="10" fill="#D6EAF8"/>
  <text x="198" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A5276">💻 로컬</text>
  <text x="390" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">현재 브랜치 확인</text>
  <text x="390" y="100" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git branch</text>

  <!-- arrow 1→2 -->
  <line x1="330" y1="120" x2="330" y2="141" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 2 ── y=145, h=82 -->
  <rect x="60" y="145" width="540" height="82" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="145" width="100" height="82" rx="10" fill="#8E44AD"/>
  <rect x="130" y="145" width="30" height="82" fill="#8E44AD"/>
  <text x="110" y="191" text-anchor="middle" font-size="24" font-weight="bold" fill="white">②</text>
  <rect x="170" y="153" width="76" height="20" rx="10" fill="#E8DAEF"/>
  <text x="208" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#6C3483">☁️→💻 pull</text>
  <text x="390" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">로컬 main 최신화</text>
  <text x="390" y="194" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git checkout main</text>
  <text x="390" y="213" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git pull origin main</text>

  <!-- arrow 2→3 -->
  <line x1="330" y1="227" x2="330" y2="248" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 3 ── y=252, h=82 -->
  <rect x="60" y="252" width="540" height="82" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="252" width="100" height="82" rx="10" fill="#2980B9"/>
  <rect x="130" y="252" width="30" height="82" fill="#2980B9"/>
  <text x="110" y="298" text-anchor="middle" font-size="24" font-weight="bold" fill="white">③</text>
  <rect x="170" y="260" width="56" height="20" rx="10" fill="#D6EAF8"/>
  <text x="198" y="274" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A5276">💻 로컬</text>
  <text x="390" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">작업 브랜치로 이동 후 최신화</text>
  <text x="390" y="300" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git checkout feature/brain</text>
  <text x="390" y="320" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git merge main</text>

  <!-- arrow 3→4 -->
  <line x1="330" y1="334" x2="330" y2="355" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 4 ── y=359, h=100 -->
  <rect x="60" y="359" width="540" height="100" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="359" width="100" height="100" rx="10" fill="#E74C3C"/>
  <rect x="130" y="359" width="30" height="100" fill="#E74C3C"/>
  <text x="110" y="413" text-anchor="middle" font-size="24" font-weight="bold" fill="white">④</text>
  <rect x="170" y="367" width="76" height="20" rx="10" fill="#FADBD8"/>
  <text x="208" y="381" text-anchor="middle" font-size="10" font-weight="bold" fill="#922B21">💻→☁️ push</text>
  <text x="390" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">코드 작업 후 업로드</text>
  <text x="390" y="407" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git add 파일명</text>
  <text x="390" y="425" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git commit -m "설명"</text>
  <text x="390" y="445" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git push origin feature/brain</text>

  <!-- arrow 4→5 -->
  <line x1="330" y1="459" x2="330" y2="480" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 5 ── y=484, h=65 -->
  <rect x="60" y="484" width="540" height="65" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="484" width="100" height="65" rx="10" fill="#27AE60"/>
  <rect x="130" y="484" width="30" height="65" fill="#27AE60"/>
  <text x="110" y="522" text-anchor="middle" font-size="24" font-weight="bold" fill="white">⑤</text>
  <rect x="170" y="492" width="56" height="20" rx="10" fill="#D5F5E3"/>
  <text x="198" y="506" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D6A39">☁️ 원격</text>
  <text x="390" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">GitHub PR 생성 → Merge</text>
  <text x="390" y="532" text-anchor="middle" font-size="12" fill="#7F8C8D">feature/brain → main 병합 요청 후 팀원 확인</text>

  <!-- ── 반복 안내 ── -->
  <rect x="60" y="562" width="540" height="28" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="330" y="580" text-anchor="middle" font-size="12" font-weight="bold" fill="#D68910">↩  Merge 완료 후 ②번부터 반복하세요</text>

</svg>
