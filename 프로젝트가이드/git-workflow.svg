<svg width="660" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 z" fill="#95A5A6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="660" height="560" fill="#F8F9FA" rx="12"/>

  <!-- Title -->
  <text x="330" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50">Git 작업 흐름 (매일 반복)</text>
  <text x="330" y="56" text-anchor="middle" font-size="12" fill="#7F8C8D">로컬은 feature 브랜치 하나만 사용합니다</text>

  <!-- ── STEP 1 ── y=70, h=65 -->
  <rect x="60" y="70" width="540" height="65" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="70" width="100" height="65" rx="10" fill="#2980B9"/>
  <rect x="130" y="70" width="30" height="65" fill="#2980B9"/>
  <text x="110" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="white">①</text>
  <rect x="170" y="78" width="56" height="20" rx="10" fill="#D6EAF8"/>
  <text x="198" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A5276">💻 로컬</text>
  <text x="390" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">현재 브랜치 확인</text>
  <text x="390" y="116" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git branch</text>

  <!-- arrow 1→2 -->
  <line x1="330" y1="135" x2="330" y2="156" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 2 ── y=160, h=82 -->
  <rect x="60" y="160" width="540" height="82" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="160" width="100" height="82" rx="10" fill="#8E44AD"/>
  <rect x="130" y="160" width="30" height="82" fill="#8E44AD"/>
  <text x="110" y="206" text-anchor="middle" font-size="24" font-weight="bold" fill="white">②</text>
  <rect x="170" y="168" width="76" height="20" rx="10" fill="#E8DAEF"/>
  <text x="208" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#6C3483">☁️→💻 pull</text>
  <text x="390" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">최신 코드 반영 (브랜치 이동 없음)</text>
  <text x="390" y="210" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git pull origin main</text>
  <text x="390" y="230" text-anchor="middle" font-size="11" fill="#95A5A6">feature 브랜치에서 바로 실행 → origin/main 내용이 내 브랜치에 반영</text>

  <!-- arrow 2→3 -->
  <line x1="330" y1="242" x2="330" y2="263" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 3 ── y=267, h=100 -->
  <rect x="60" y="267" width="540" height="100" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="267" width="100" height="100" rx="10" fill="#E74C3C"/>
  <rect x="130" y="267" width="30" height="100" fill="#E74C3C"/>
  <text x="110" y="321" text-anchor="middle" font-size="24" font-weight="bold" fill="white">③</text>
  <rect x="170" y="275" width="76" height="20" rx="10" fill="#FADBD8"/>
  <text x="208" y="289" text-anchor="middle" font-size="10" font-weight="bold" fill="#922B21">💻→☁️ push</text>
  <text x="390" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">코드 작업 후 업로드</text>
  <text x="390" y="315" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git add 파일명</text>
  <text x="390" y="333" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git commit -m "설명"</text>
  <text x="390" y="351" text-anchor="middle" font-size="12" fill="#7F8C8D" font-family="Consolas, monospace">git push origin feature/본인모듈명</text>

  <!-- arrow 3→4 -->
  <line x1="330" y1="367" x2="330" y2="388" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- ── STEP 4 ── y=392, h=65 -->
  <rect x="60" y="392" width="540" height="65" rx="10" fill="white" stroke="#BDC3C7" stroke-width="1.5"/>
  <rect x="60" y="392" width="100" height="65" rx="10" fill="#27AE60"/>
  <rect x="130" y="392" width="30" height="65" fill="#27AE60"/>
  <text x="110" y="430" text-anchor="middle" font-size="24" font-weight="bold" fill="white">④</text>
  <rect x="170" y="400" width="56" height="20" rx="10" fill="#D5F5E3"/>
  <text x="198" y="414" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D6A39">☁️ 원격</text>
  <text x="390" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">GitHub PR 생성 → Merge</text>
  <text x="390" y="440" text-anchor="middle" font-size="12" fill="#7F8C8D">feature/본인모듈 → main 병합 요청 후 팀원 확인</text>

  <!-- ── 반복 안내 ── -->
  <rect x="60" y="472" width="540" height="28" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="330" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#D68910">↩  Merge 완료 후 ②번부터 반복하세요</text>

  <!-- ── 핵심 포인트 ── -->
  <rect x="60" y="514" width="540" height="36" rx="8" fill="#EBF5FB" stroke="#2980B9" stroke-width="1.5"/>
  <text x="330" y="530" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">💡 로컬 main 브랜치 불필요 — feature 브랜치 하나만 사용</text>
  <text x="330" y="544" text-anchor="middle" font-size="11" fill="#2980B9">git pull origin main 한 줄로 최신화 완료</text>

</svg>
