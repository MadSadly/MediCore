server {
    listen 80;

    client_max_body_size 500m;

    # ── WJ: 뇌종양 (192.168.0.9) ──────────────────────────────────
    location /ai/brain/ {
        proxy_pass http://192.168.0.9:8000/ai/brain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── MS: 피부질환 (192.168.0.20) ───────────────────────────────
    location /ai/skin/ {
        proxy_pass http://192.168.0.39:8000/ai/skin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── DH: 허리디스크 (192.168.0.13) ────────────────────────────────
    location /ai/spine/ {
        proxy_pass http://192.168.0.13:8000/ai/spine/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── NJ: 신부전 (192.168.0.5) ──────────────────────────────────
    location /ai/kidney/ {
        proxy_pass http://192.168.0.5:8000/ai/kidney/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── GW: 대장암 (192.168.0.73) ─────────────────────────────────
    location /ai/colon/ {
        proxy_pass http://192.168.0.73:8000/ai/colon/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── SH: 안과질환 (192.168.0.32) ───────────────────────────────
    location /ai/sh/ {
        proxy_pass http://192.168.0.32:8000/ai/sh/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ── Spring API ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # ── React 프론트 ───────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
