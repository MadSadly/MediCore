server {
    listen 80;

    # AI 요청은 로컬 FastAPI로 (SSE 스트리밍 포함)
    location /ai/ {
        proxy_pass http://ai-server:8000/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE 스트리밍을 위해 버퍼링 off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # API 요청은 서버 PC Spring으로 직접 라우팅
    location /api/ {
        proxy_pass http://192.168.0.39:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # 나머지(React 정적 파일)는 서버 PC 프론트로
    location / {
        proxy_pass http://192.168.0.39:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
