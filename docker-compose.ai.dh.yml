services:

  ai-server:
    build:
      context: ./AI
      dockerfile: DH/Dockerfile # 담현님 파트의 Dockerfile을 바라보도록 수정
    container_name: medicore-ai-dh # 가이드의 4단계 실행 이름에 맞춤
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_URL: postgresql://medicore:${DB_PASSWORD}@192.168.0.20:5432/medicoredb
      GCP_KEY_PATH: /app/secrets/gcp-key.json
    volumes:
      - ./secrets/gcp-key.json:/app/secrets/gcp-key.json:ro
      - ai_models:/app/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ai/spine || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  ai_models: