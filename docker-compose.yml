services:

  # ─────────────────────────────────────────
  # PostgreSQL 16 + pgvector
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medizero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medizerodb
      POSTGRES_USER: medizero
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medizero -d medizerodb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # ─────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medizero-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────────────────────────
  # Spring Boot Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend-main
      dockerfile: Dockerfile
    container_name: medizero-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-lb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/medizerodb
      DB_USERNAME: medizero
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # AI 요청은 로드밸런서를 통해 전달
      AI_SERVER_URL: http://ai-lb:80
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  # ─────────────────────────────────────────
  # React Frontend (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medizero-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────────────────────────
  # FastAPI AI 로드밸런서 (Nginx)
  # ai-server 인스턴스들 앞에서 요청 분산
  # ─────────────────────────────────────────
  ai-lb:
    image: nginx:alpine
    container_name: medizero-ai-lb
    restart: unless-stopped
    depends_on:
      - ai-server
    ports:
      - "8000:80"
    volumes:
      - ./nginx/ai-lb.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m

  # ─────────────────────────────────────────
  # FastAPI AI Server (멀티 인스턴스)
  # 기본 1개 → 최대 3개까지 스케일 가능
  #
  # 3개로 늘리려면:
  #   docker compose up --scale ai-server=3 -d
  # ─────────────────────────────────────────
  ai-server:
    build:
      context: ./AI
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://medizero:${DB_PASSWORD}@postgres:5432/medizerodb
    # 포트는 ai-lb가 내부적으로 처리 (외부 노출 없음)
    expose:
      - "8000"
    volumes:
      - ai_models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # replicas 기본값 1, 스케일업 시 3으로 변경
      replicas: 1
      resources:
        limits:
          # 3개 띄울 경우: 3 x 2.5g = 7.5g (16g RAM 기준 안전)
          memory: 2560m

volumes:
  postgres_data:
  redis_data:
  ai_models:

networks:
  default:
    name: medizero-network
