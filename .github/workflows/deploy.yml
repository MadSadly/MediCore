name: Deploy (Self-hosted Runner)

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Master PC 배포
  # 조건: Master PC에 GitHub Actions Self-hosted Runner 설치 필요
  # 설치법: GitHub → Settings → Actions → Runners → New self-hosted runner
  # ─────────────────────────────────────────────────────────────
  deploy-master:
    name: Deploy Master PC
    runs-on: self-hosted   # Master PC의 러너가 실행
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          WORKER1_IP=${{ secrets.WORKER1_IP }}
          WORKER2_IP=${{ secrets.WORKER2_IP }}
          WORKER3_IP=${{ secrets.WORKER3_IP }}
          WORKER4_IP=${{ secrets.WORKER4_IP }}
          WORKER5_IP=${{ secrets.WORKER5_IP }}
          WORKER6_IP=${{ secrets.WORKER6_IP }}
          EOF

      - name: Pull & Restart Master services
        run: |
          docker compose -f docker-compose.master.yml pull
          docker compose -f docker-compose.master.yml up -d --build

      - name: Wait for health check
        run: |
          echo "Spring Boot 기동 대기 중..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "✅ Master 서버 정상 기동"
              exit 0
            fi
            echo "  대기 중... ($i/12)"
            sleep 10
          done
          echo "❌ 기동 타임아웃"
          exit 1

      - name: Notify deploy result
        if: always()
        run: |
          STATUS=${{ job.status }}
          echo "배포 결과: $STATUS"